<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0b10" />
  <meta name="description" content="OpenMusic — a quiet place to discover and play music." />
  <title>OpenMusic — Listen your way</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=3" />
  <link rel="stylesheet" href="./refinement.css?v=4" />
</head>
<body>
  <aside class="sidebar" aria-label="Main navigation">
    <button class="wordmark" data-action="navigate" data-view="home" aria-label="OpenMusic, home"><span class="brand-mark"><i></i><i></i><i></i><i></i></span>openmusic</button>
    <nav class="main-nav">
      <button class="nav-item active" data-action="navigate" data-view="home"><span data-icon="compass"></span><span>Home</span></button>
      <button class="nav-item" data-action="navigate" data-view="search"><span data-icon="search"></span><span>Search</span></button>
      <button class="nav-item" data-action="navigate" data-view="library"><span data-icon="library"></span><span>Your Library</span></button>
    </nav>
    <div class="nav-label collection-label">YOUR LIBRARY<button class="icon-button small" data-action="new-playlist" aria-label="Create playlist"><span data-icon="plus"></span></button></div>
    <nav class="collection-nav">
      <button class="collection-item" data-action="navigate" data-view="liked"><span class="collection-cover liked-cover" data-icon="heart"></span><span>Liked Songs<small id="liked-count">0 tracks</small></span></button>
      <button class="collection-item" data-action="open-album" data-id="0"><img src="./assets/hero.png" alt="" /><span>Afterglow<small>Playlist</small></span></button>
      <button class="collection-item" data-action="open-album" data-id="1"><img src="./assets/cover-coast.jpg" alt="" /><span>Blue Hours<small>Playlist</small></span></button>
      <div id="custom-playlists"></div>
    </nav>
    <div class="sidebar-bottom"><button class="user-profile" data-action="profile"><span class="avatar">A</span><span>Alex</span><span data-icon="chevrons"></span></button></div>
  </aside>

  <main class="main-shell">
    <header class="topbar"><div class="breadcrumb" id="breadcrumb">HOME</div><div class="topbar-actions"><button class="search-trigger" aria-label="Search music" data-action="navigate" data-view="search"><span data-icon="search"></span><span>Search music</span><kbd>⌘ K</kbd></button><button class="mobile-avatar avatar" data-action="profile" aria-label="Profile">A</button></div></header>
    <div id="content" tabindex="-1"></div>
    <footer class="page-footer"><span class="footer-mark">openmusic</span><button data-action="about">About OpenMusic <span>↗</span></button></footer>
  </main>

  <section class="player" aria-label="Music player">
    <div class="now-playing"><button class="mini-art-button" data-action="fullscreen" aria-label="Open full player"><img id="player-art" src="./assets/hero.png" alt="Current track artwork" /><span data-icon="expand"></span></button><button class="now-playing-info" data-action="fullscreen"><strong id="player-title">Weightless</strong><span id="player-artist">Sora · Afterglow</span></button><button class="icon-button player-like" data-action="like-current" aria-label="Like current track"><span data-icon="heart"></span></button></div>
    <div class="playback"><div class="transport"><button class="icon-button secondary shuffle-button" data-action="shuffle" aria-label="Shuffle" aria-pressed="false"><span data-icon="shuffle"></span></button><button class="icon-button" data-action="previous" aria-label="Previous track"><span data-icon="previous"></span></button><button class="play-button main-play" data-action="toggle-play" aria-label="Play"><span data-icon="play"></span></button><button class="icon-button" data-action="next" aria-label="Next track"><span data-icon="next"></span></button><button class="icon-button secondary repeat-button" data-action="repeat" aria-label="Repeat track" aria-pressed="false"><span data-icon="repeat"></span></button></div><div class="timeline"><time id="elapsed">0:00</time><input id="progress" type="range" min="0" max="218" value="0" step="0.1" aria-label="Playback position" /><time id="duration">3:38</time></div></div>
    <div class="player-tools"><span class="audio-quality" title="Original demo compositions">STEREO</span><button class="icon-button volume-button" data-action="mute" aria-label="Mute"><span data-icon="volume"></span></button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.65" aria-label="Volume" /><span class="tool-divider"></span><button class="icon-button queue-button" data-action="queue" aria-label="Open queue" aria-expanded="false"><span data-icon="queue"></span></button><button class="icon-button" data-action="fullscreen" aria-label="Full screen"><span data-icon="expand"></span></button></div>
  </section>

  <nav class="mobile-nav" aria-label="Mobile navigation"><button data-action="navigate" data-view="home" class="active"><span data-icon="compass"></span>Home</button><button data-action="navigate" data-view="search"><span data-icon="search"></span>Search</button><button data-action="navigate" data-view="library"><span data-icon="library"></span>Library</button></nav>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=3"></script>
</body>
</html>
